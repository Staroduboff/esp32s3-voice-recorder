; Прошивка диктофона: ESP32-S3-Zero + микрофон INMP441 + microSD, управление кнопкой BOOT.
; Описание устройства и сборки — README.md, код — src/ (начинать чтение с src/main.cpp).

[env:esp32-s3-zero]
; Arduino-ядро 3.0.7 (ESP-IDF 5.1) из сборки pioarduino. Официальная платформа PlatformIO
; поставляет старое ядро 2.x, а для этой прошивки нужен I2S-драйвер и USB из ядра 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip

; Отдельного профиля для Waveshare ESP32-S3-Zero нет, берём DevKitC-1 и правим размер флеша:
; на Zero стоит ESP32-S3FH4R2 (4 МБ флеш-памяти, 2 МБ PSRAM; PSRAM прошивке не нужна)
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
framework = arduino

; Монитор порта: скорость для USB-CDC роли не играет, но указана для порядка
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; USB-UART-чипа на плате нет, USB работает через встроенный контроллер ESP32-S3 в режиме OTG
; (библиотека TinyUSB). Компьютер видит плату сразу как COM-порт (Serial) и USB-накопитель.
build_unflags = -DARDUINO_USB_MODE=1  ; профиль DevKitC-1 по умолчанию включает другой режим USB
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Как идёт прошивка: PlatformIO открывает COM-порт платы на скорости 1200 бод — это сигнал
; прошивке перезагрузиться в загрузчик. Загрузчик появляется на другом COM-порту, PlatformIO
; его дожидается и шьёт туда. Если не сработало: зажать BOOT, нажать и отпустить RESET,
; отпустить BOOT и нажать Upload ещё раз.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
